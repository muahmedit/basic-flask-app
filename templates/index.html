<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Welcome to My Flask Blog!</h1>

        <!-- Navigation link to the /add route -->
        <div class="nav" style="margin-bottom: 20px;">
            <a href="{{ url_for('add') }}" class="btn">Add New Blog Post</a>
        </div>

        <!-- Loop through all posts passed from app.py -->
        {% for post in posts %}
            <div class="post" style="border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px;">
                <h2>{{ post.title }}</h2>
                <p class="author"><em>By {{ post.author }}</em></p>
                <p>{{ post.content }}</p>
                
                <!-- Action Buttons: Update and Delete -->
                <div style="margin-top: 10px;">
                    <a href="{{ url_for('update', post_id=post.id) }}" class="btn-update" style="margin-right: 10px; text-decoration: none; color: blue;">Edit / Update</a>
                    <a href="{{ url_for('delete', post_id=post.id) }}" class="btn-delete" style="color: red; text-decoration: none;" onclick="return confirm('Are you sure you want to delete this post?');">Delete</a>
                </div>
            </div>
        {% else %}
            <p>No blog posts yet. Click "Add New Blog Post" to create one!</p>
        {% endfor %}
    </div>
</body>
</html>
